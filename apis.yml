aid: remarcable
name: Remarcable
description: >-
  Remarcable is an AI-powered procurement and materials-management platform built
  for MEP (mechanical, electrical, plumbing) trade contractors, distributors, and
  construction teams. It unifies purchasing, purchase-order and invoice processing,
  inventory and warehouse visibility, prefabrication workflows, and tool/equipment
  crib management into a single system, with AI-assisted smart search, document OCR,
  field note-to-order conversion, and invoice verification. Remarcable connects to
  accounting and ERP systems (QuickBooks Desktop and Online, Sage 50/100/300,
  Acumatica, Viewpoint Spectrum/Vista, Foundation, Procore, and more) plus supplier
  catalogs to automate data entry and reduce errors. The company reports 30,000+
  active users and over $900M in monthly material purchases processed, is SOC 2
  certified, and raised a $15M Series A led by Insight Partners. Remarcable does not
  currently publish a public developer API or SDK program; its integration surface
  is delivered through pre-built ERP and supplier connectors.
